[package]
name = "droprate-launcher"
version = "0.1.0"
description = "DropRate — play the games you own"
authors = ["DropRate"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rustls rather than the system TLS stack: one less thing that differs between a
# developer's machine and a player's, and no OpenSSL to find on Windows.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros"] }
futures-util = "0.3"

zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[features]
# Set by `tauri build`; keeps the custom-protocol path out of dev builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# A launcher people download should be small. These cost compile time, not speed.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
